<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MALA Immobilien</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f1f1f;
        }

        .container {
            text-align: center;
            padding: 40px 25px;
            max-width: 700px;
        }

        .logo {
            width: min(280px, 70vw);
            height: auto;
            margin-bottom: 55px;
        }

        h1 {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #666666;
            font-weight: 300;
        }

        .line {
            width: 45px;
            height: 1px;
            background: #222222;
            margin: 0 auto 25px;
        }

        @media (max-width: 600px) {
            .logo {
                width: min(240px, 75vw);
                margin-bottom: 45px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img src="logo.png" alt="MALA Immobilien" class="logo">

        <div class="line"></div>

        <h1>Website in Erstellung</h1>

        <p>
            Wir arbeiten derzeit an unserem neuen digitalen Auftritt.
            <br>
            Schon bald finden Sie hier weitere Informationen zu MALA Immobilien.
        </p>

    </main>

</body>
</html>
