<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MALA Immobilien</title>

    <meta name="description" content="MALA Immobilien – persönliche Beratung und ausgewählte Immobilien.">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #faf9f7;
            color: #1c1c1c;
            font-family: "DM Sans", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 30px;
        }

        .content {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        /* LOGO */
        .logo {
            width: min(340px, 72vw);
            height: auto;
            display: block;
            margin: 0 auto 65px;
        }

        /* FEINE LINIE */
        .divider {
            width: 48px;
            height: 1px;
            background: #252525;
            margin: 0 auto 34px;
        }

        /* HAUPTÜBERSCHRIFT */
        h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(30px, 4vw, 43px);
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: 0.01em;
            margin-bottom: 24px;
        }

        /* BESCHREIBUNG */
        .description {
            max-width: 560px;
            margin: 0 auto;
            font-size: 15px;
            font-weight: 300;
            line-height: 1.8;
            color: #686868;
        }

        /* KONTAKT */
        .contact {
            margin-top: 48px;
        }

        .contact a {
            color: #242424;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #bdbdbd;
            padding-bottom: 4px;
            transition: border-color 0.25s ease;
        }

        .contact a:hover {
            border-color: #242424;
        }

        /* FOOTER */
        footer {
            margin-top: 75px;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #999999;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .page {
                padding: 35px 24px;
            }

            .logo {
                width: min(285px, 78vw);
                margin-bottom: 50px;
            }

            .divider {
                margin-bottom: 28px;
            }

            h1 {
                font-size: 29px;
                line-height: 1.3;
                margin-bottom: 20px;
            }

            .description {
                font-size: 14px;
                line-height: 1.75;
            }

            .contact {
                margin-top: 40px;
            }

            footer {
                margin-top: 60px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="content">

            <img
                src="logo1.png"
                alt="MALA Immobilien"
                class="logo"
            >

            <div class="divider"></div>

            <h1>
                Ihr neues Zuhause<br>
                beginnt hier.
            </h1>

            <p class="description">
                Unsere neue Website entsteht derzeit.
                Schon bald finden Sie hier weitere Informationen
                zu MALA Immobilien und unseren ausgewählten Objekten.
            </p>

            <div class="contact">
                <a href="mailto:info@mala-immobilien.de">
                    info@mala-immobilien.de
                </a>
            </div>

            <footer>
                MALA Immobilien
            </footer>

        </div>

    </main>

</body>
</html>
